[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moltrust"
version = "0.2.0"
description = "MolTrust SDK — DID resolver and trust layer for the agent economy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CryptoKRI GmbH", email = "kersten.kroehl@cryptokri.ch"},
]
keywords = [
    "ai", "agents", "trust", "identity",
    "did", "did-resolver", "verifiable-credentials",
    "w3c", "reputation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://moltrust.ch"
Documentation = "https://api.moltrust.ch/docs"
Repository = "https://github.com/MoltyCel/moltrust-sdk"
Issues = "https://github.com/MoltyCel/moltrust-sdk/issues"
Changelog = "https://github.com/MoltyCel/moltrust-sdk/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["moltrust*"]
