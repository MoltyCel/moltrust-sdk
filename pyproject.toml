[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moltrust"
version = "0.1.0"
description = "MolTrust SDK - Trust Layer for the Agent Economy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "CryptoKRI GmbH", email = "kersten.kroehl@cryptokri.ch"},
]
keywords = ["ai", "agents", "trust", "identity", "did", "verifiable-credentials", "reputation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
]
dependencies = [
    "httpx>=0.25.0",
]

[project.urls]
Homepage = "https://moltrust.ch"
Documentation = "https://api.moltrust.ch/docs"
Repository = "https://github.com/MoltyCel/moltrust-sdk"

[tool.setuptools.packages.find]
include = ["moltrust*"]
